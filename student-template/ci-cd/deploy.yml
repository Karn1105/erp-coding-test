# Question 4: CI/CD & GitHub Skills (15 points)
# Context: Your repository needs a GitHub Actions workflow for automated testing and building
#
# Task: Create a GitHub Actions workflow that:
# 1. Triggers on push to the main branch
# 2. Runs npm install and npm run build for the frontend
# 3. Runs python -m pytest for backend (if Python) OR mvn test (if Java)
#
# INSTRUCTIONS:
# - Write your YAML workflow below
# - Save this file as ci-cd/deploy.yml in your repository
# - Make sure indentation is correct (YAML is sensitive to spaces)

# TODO: Write your GitHub Actions workflow YAML below
name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
        - python-version: '3.10'

      - name: Install Frontend Dependencies & Build
        run: |
          npm install
          npm run build

      - name: Run Backend Tests
        run: |
          python -m pytest
